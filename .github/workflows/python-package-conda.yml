name: Commodity forecast research quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas pytest ruff

      - name: Lint critical errors
        run: ruff check app.py src tests --select E9,F63,F7,F82

      - name: Compile Python sources
        run: python -m compileall -q app.py src tests

      - name: Run regression suite
        run: python -m pytest -q

      - name: Verify validation module
        run: python -c "import src.forecaster, src.validation"
