name: Commodity forecast research quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # PEP 604 unions (for example pd.Series | None) need Python 3.10.
        # pandas==2.2.3 is classified through 3.12, so that is the ceiling.
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          # CPU wheel. The version matches requirements.txt; this index
          # avoids the default CUDA wheel.
          python -m pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
          # Pins come from the requirements files. Prophet, pmdarima, and
          # plotly stay uninstalled so the suite still covers those fallbacks.
          python -m pip install \
            -c requirements.txt \
            -r requirements-dev.txt \
            numpy pandas scipy statsmodels streamlit yfinance

      - name: Lint critical errors
        run: ruff check app.py src tests scripts --select E9,F63,F7,F82

      - name: Compile Python sources
        run: python -m compileall -q app.py src tests scripts

      - name: Run regression suite
        run: python -m pytest -q

      - name: Verify validation module
        run: python -c "import src.forecaster, src.validation"
