name: refresh-usda

on:
  workflow_dispatch:
  push:
    branches: [usda-nass-features]
    paths: [.github/workflows/refresh-usda.yml]

permissions:
  contents: read

jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install requests pandas
      - name: Pull NASS Quick Stats yields
        env:
          USDA_NASS_API_KEY: ${{ secrets.USDA_NASS_API_KEY }}
        run: python scripts/refresh_usda.py
      - uses: actions/upload-artifact@v4
        with:
          name: usda-cache
          path: data/usda_cache.json
